name: Feature request
description: Something the project does not do yet.
labels: ['type:feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: The change you have in mind, if you have one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: priority
    attributes:
      label: How urgent is this for you?
      description: Your honest read. Triage may change it, and that is normal.
      options:
        - 'Blocking: I cannot use it and have no way around it'
        - 'Significant: it costs me real time, but I can work around it'
        - 'Minor: it would be nice, but it is not in my way'
    validations:
      required: true
